<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><title>Спільний перегляд</title>
<style>
body{margin:0;background:#121216;color:#eee;font-family:system-ui,"Segoe UI",sans-serif;padding:18px}
h1{font-size:1.3rem;margin:0 0 14px}
.card{background:#1d1d24;border:1px solid #33333d;border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row:last-child{margin-bottom:0}
input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #33333d;background:#121216;color:#eee}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #33333d;background:#26262f;color:#eee;cursor:pointer}
button.p{background:#6d4aff;border-color:#6d4aff}button.big{padding:12px 20px;font-weight:600}
.mut{color:#9a9aa5;font-size:.9rem}#log{max-height:200px;overflow:auto;font-size:.85rem;color:#9a9aa5}
</style></head><body>
<h1>🎬 Спільний перегляд</h1>
<div class="card">
  <div class="row"><input id="srv" size="38" placeholder="Адреса сервера: https://назва.onrender.com"></div>
  <div class="row"><input id="room" size="16" placeholder="Код кімнати"><button id="join" class="p">Увійти в кімнату</button><span class="mut" id="status">Не підключено</span><span class="mut" id="peers"></span></div>
</div>
<div class="card">
  <div class="row"><button id="host" class="big p">📂 Я хост: обрати серію і почати</button></div>
  <div class="mut">Хост обирає файл на своєму комп'ютері. Решта автоматично бачать його в оригінальній якості (відкриється вікно mpv). Пауза й перемотка синхронні в усіх.</div>
</div>
<div class="card">
  <div class="row"><span>🔊 Гучність</span><input type="range" id="vol" min="0" max="130" value="100" style="flex:1;min-width:160px;padding:0"><span id="volv" class="mut">100</span></div>
  <div class="row"><label class="mut"><input type="checkbox" id="volsync" checked> Синхронізувати гучність з усіма в кімнаті</label></div>
</div>
<div class="card"><div class="row"><button id="mpvp">Шлях до mpv…</button><span class="mut">потрібно лише якщо mpv не знаходиться автоматично</span></div></div>
<div class="card" id="log"></div>
<script src="app.js"></script></body></html>
